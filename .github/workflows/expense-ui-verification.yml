name: NUS Expense UI Verification

on:
  push:
    branches: [ fix/expense-ui-6.5.4 ]

concurrency:
  group: nus-expense-ui-verification
  cancel-in-progress: true

env:
  APPLICATION_VERIFICATION_SHA: 55eb29ed5520ce21458e3b79706ef73335151cc3

jobs:
  verify-expense-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact application SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPLICATION_VERIFICATION_SHA }}

      - name: Verify exact application SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'Application verification SHA: %s\n' "$actual"
          test "$actual" = "$APPLICATION_VERIFICATION_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=nus .

      - name: Configure NUS APK branding
        shell: bash
        run: |
          set -euo pipefail

          ICON_SOURCE='Neural_network_brain_app_icon_202609031742.jpeg'
          test -s "$ICON_SOURCE"

          sudo apt-get update
          sudo apt-get install -y imagemagick

          command -v identify
          command -v convert

          identify_output="$(identify -format '%m %wx%h %[channels]' "$ICON_SOURCE")"
          printf 'NUS icon source: %s\n' "$identify_output"
          case "$identify_output" in
            JPEG\ *x*\ *) ;;
            *) echo 'ERROR: NUS launcher source must be a JPEG image.' >&2; exit 1 ;;
          esac

          for spec in \
            'mdpi:48' \
            'hdpi:72' \
            'xhdpi:96' \
            'xxhdpi:144' \
            'xxxhdpi:192'; do
            density="${spec%%:*}"
            size="${spec##*:}"
            target="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$target"
            convert "$ICON_SOURCE" \
              -auto-orient \
              -resize "${size}x${size}^" \
              -gravity center \
              -extent "${size}x${size}" \
              -strip \
              -define png:color-type=6 \
              "$target/ic_launcher.png"
            cp "$target/ic_launcher.png" "$target/ic_launcher_round.png"
          done

          rm -f \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          manifest='android/app/src/main/AndroidManifest.xml'
          python3 - "$manifest" <<'PY'
          from pathlib import Path
          import re
          import sys
          manifest = Path(sys.argv[1])
          text = manifest.read_text()
          updated, count = re.subn(r'android:label="[^"]*"', 'android:label="NUS"', text, count=1)
          if count != 1:
              raise SystemExit('ERROR: Could not normalize Android application label.')
          manifest.write_text(updated)
          PY

          grep -q 'android:label="NUS"' "$manifest"
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Restore repository tests after Flutter scaffolding
        run: |
          git checkout -- test/widget_test.dart
          test -f test/schedule_store_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Verify application commit SHA in CI
        run: git rev-parse HEAD

      - name: Flutter analyze
        run: flutter analyze

      - name: Focused Expense UI tests
        run: flutter test test/expense_ui_test.dart

      - name: Full test suite
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK branding and icon resources
        shell: bash
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-debug.apk'
          test -s "$APK"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -print | sort -V | tail -n 1)"
          test -x "$AAPT2"
          BADGING="$($AAPT2 dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "application-label:'NUS'"
          unzip -l "$APK" | grep -E 'res/mipmap-(mdpi|hdpi|xhdpi|xxhdpi|xxxhdpi)(-v[0-9]+)?/ic_launcher(_round)?\.png$'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nus-expense-ui-verification-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
