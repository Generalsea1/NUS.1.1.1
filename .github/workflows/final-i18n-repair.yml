name: Final NUS localization repair

on:
  push:
    branches: [fix/android-build-workflow]
    paths: ['.github/workflows/final-i18n-repair.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fix Arabic/English translation ordering
        shell: python3 {0}
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          replacements = {
            "t('العربية', 'English')": "t('English', 'العربية')",
            "t('لوحة التحكم', 'Control center')": "t('Control center', 'لوحة التحكم')",
            "t('النهارده', 'Today')": "t('Today', 'النهارده')",
            "t('القادم', 'Upcoming')": "t('Upcoming', 'القادم')",
            "t('إيه اللي وراك؟', 'What is on your agenda?')": "t('What is on your agenda?', 'إيه اللي وراك؟')",
            "t('خلي NUS ماسك يومك معاك من أول تذكير.', 'Let NUS keep your day organized from the first reminder.')": "t('Let NUS keep your day organized from the first reminder.', 'خلي NUS ماسك يومك معاك من أول تذكير.')",
            "t('إضافة تذكير', 'Add reminder')": "t('Add reminder', 'إضافة تذكير')",
            "t('إضافة', 'Add')": "t('Add', 'إضافة')",
            "t('تذكير جديد', 'New reminder')": "t('New reminder', 'تذكير جديد')",
            "t('اكتب التذكير', 'Reminder title')": "t('Reminder title', 'اكتب التذكير')",
            "t('مثلاً: دفع فاتورة الكهرباء', 'Example: Pay the electricity bill')": "t('Example: Pay the electricity bill', 'مثلاً: دفع فاتورة الكهرباء')",
            "t('التاريخ والوقت', 'Date & time')": "t('Date & time', 'التاريخ والوقت')",
            "t('إلغاء', 'Cancel')": "t('Cancel', 'إلغاء')",
            "t('احفظ التذكير', 'Save reminder')": "t('Save reminder', 'احفظ التذكير')",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NUS CI'
          git config user.email '134608530+Generalsea1@users.noreply.github.com'
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ui): correct Arabic default localization ordering [skip ci]'
          git push origin HEAD:fix/android-build-workflow
