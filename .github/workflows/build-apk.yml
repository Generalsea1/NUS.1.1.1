name: Build NUS Android APK

# Final Android gate: analyze, test, build, inspect, archive, and preserve the original NUS app icon.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'
      - 'Neural_network_brain_app_icon_202609031742.jpeg'
  push:
    branches: [main]

concurrency:
  group: nus-android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=nus .

      - name: Configure Android integration and restore original NUS icon
        shell: python3 {0}
        run: |
          from pathlib import Path
          import re
          import shutil
          import subprocess

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')

          if 'android:scheme="nus"' not in text:
              activity_marker = 'android:name=".MainActivity"'
              activity_index = text.find(activity_marker)
              if activity_index < 0:
                  raise SystemExit('ERROR: Flutter MainActivity was not found.')
              activity_end = text.find('</activity>', activity_index)
              if activity_end < 0:
                  raise SystemExit('ERROR: MainActivity closing tag was not found.')
              deep_link = (
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.VIEW" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />\n'
                  '                <category android:name="android.intent.category.BROWSABLE" />\n'
                  '                <data android:scheme="nus" />\n'
                  '            </intent-filter>\n'
              )
              text = text[:activity_end] + deep_link + text[activity_end:]

          text, count = re.subn(r'android:label="[^"]*"', 'android:label="NUS"', text, count=1)
          if count != 1:
              raise SystemExit('ERROR: Could not set Android application label.')
          manifest.write_text(text, encoding='utf-8')

          gradle = Path('android/app/build.gradle.kts')
          gradle_text = gradle.read_text(encoding='utf-8')
          if 'isCoreLibraryDesugaringEnabled = true' not in gradle_text:
              marker = 'android {\n'
              if marker not in gradle_text:
                  raise SystemExit('ERROR: Android Gradle android block was not found.')
              gradle_text = gradle_text.replace(
                  marker,
                  'android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }\n',
                  1,
              )
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if dependency not in gradle_text:
              gradle_text += f'\n\ndependencies {{\n    {dependency}\n}}\n'
          gradle.write_text(gradle_text, encoding='utf-8')

          permissions = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
          ]
          final_manifest = manifest.read_text(encoding='utf-8')
          for permission in permissions:
              if permission not in final_manifest:
                  final_manifest = final_manifest.replace(
                      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                      f'    <uses-permission android:name="{permission}" />',
                      1,
                  )

          if 'ScheduledNotificationReceiver' not in final_manifest:
              receiver_block = (
                  '        <receiver\n'
                  '            android:exported="false"\n'
                  '            android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                  '        <receiver\n'
                  '            android:exported="false"\n'
                  '            android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED" />\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n'
                  '                <action android:name="android.intent.action.PACKAGE_REPLACED" />\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n'
                  '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n'
              )
              final_manifest = final_manifest.replace('</application>', receiver_block + '    </application>', 1)

          manifest.write_text(final_manifest, encoding='utf-8')

          icon_source = Path('Neural_network_brain_app_icon_202609031742.jpeg')
          if not icon_source.is_file():
              raise SystemExit(f'ERROR: Original NUS icon not found: {icon_source}')
          if shutil.which('convert') is None:
              raise SystemExit('ERROR: ImageMagick convert is required to restore the original icon.')

          densities = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in densities.items():
              target = Path('android/app/src/main/res') / folder
              target.mkdir(parents=True, exist_ok=True)
              for filename in ('ic_launcher.png', 'ic_launcher_round.png'):
                  output = target / filename
                  subprocess.run(
                      ['convert', str(icon_source), '-auto-orient', '-resize', f'{size}x{size}^',
                       '-gravity', 'center', '-extent', f'{size}x{size}', 'png32:' + str(output)],
                      check=True,
                  )

          assert 'android:label="NUS"' in final_manifest
          assert 'android:scheme="nus"' in final_manifest
          assert all(permission in final_manifest for permission in permissions)
          assert 'ScheduledNotificationReceiver' in final_manifest
          assert dependency in gradle.read_text(encoding='utf-8')
          assert all((Path('android/app/src/main/res') / folder / 'ic_launcher.png').is_file() for folder in densities)
          print('Android configuration and original NUS icon verified.')

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Verify packaged Android metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-debug.apk'
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -print | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print | sort -V | tail -n 1)"
          test -x "$AAPT2"
          test -x "$APKANALYZER"
          BADGING="$($AAPT2 dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "application-label:'NUS'"
          printf '%s\n' "$BADGING" | grep -E 'application-icon(-[0-9]+)?:'
          MANIFEST="$($APKANALYZER manifest print "$APK")"
          printf '%s\n' "$MANIFEST" | grep -F 'android.intent.action.VIEW'
          printf '%s\n' "$MANIFEST" | grep -F 'android.intent.category.BROWSABLE'
          printf '%s\n' "$MANIFEST" | grep -Ei 'scheme.*nus|nus.*scheme'
          echo 'Packaged NUS Android metadata verified.'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nus-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
