name: Build NOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: nos-android-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=nos .

      - name: Configure Android notification scheduling
        shell: python
        run: |
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission_anchor = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if permission_anchor not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                  '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
                  1,
              )

          receiver_name = 'com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver'
          if receiver_name not in text:
              receiver_block = '''\n        <receiver\n            android:exported="false"\n            android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver\n            android:exported="false"\n            android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n                <action android:name="android.intent.action.PACKAGE_REPLACED" />\n            </intent-filter>\n        </receiver>\n'''
              text = text.replace('</application>', receiver_block + '    </application>', 1)
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          desugar_flag = 'isCoreLibraryDesugaringEnabled = true'
          if desugar_flag not in text:
              if 'compileOptions {' in text:
                  text = text.replace(
                      'compileOptions {\n',
                      'compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n',
                      1,
                  )
              else:
                  text = text.replace(
                      'android {\n',
                      'android {\n    compileOptions {\n'
                      '        isCoreLibraryDesugaringEnabled = true\n'
                      '    }\n',
                      1,
                  )
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          if dependency not in text:
              text = text.replace(
                  'dependencies {\n',
                  'dependencies {\n    ' + dependency + '\n',
                  1,
              )
          gradle.write_text(text)

      - name: Restore repository tests after Flutter scaffolding
        run: |
          git checkout -- test/widget_test.dart
          test -f test/schedule_store_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nos-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
