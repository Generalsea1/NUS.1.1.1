name: One-time wire real AI hub

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, 'ci: wire real AI hub from home') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch main.dart
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/main.dart')
          text = path.read_text()
          old_import = "import 'features/appointments/presentation/appointments_page.dart';\n"
          new_import = old_import + "import 'features/ai/presentation/ai_hub_page.dart';\n"
          if "features/ai/presentation/ai_hub_page.dart" not in text:
              text = text.replace(old_import, new_import, 1)
          old_nav = "builder: (_) => const _AiLaunchPage(),"
          new_nav = "builder: (_) => const AiHubPage(),"
          if old_nav not in text:
              raise SystemExit('AI navigation placeholder not found')
          text = text.replace(old_nav, new_nav, 1)
          marker = """\n/// Lightweight navigation card used to keep the home shell independent from\n/// optional AI infrastructure. The real AI page is opened from feature pages\n/// where the AI connection provider is available.\nclass _AiLaunchPage extends StatelessWidget {\n  const _AiLaunchPage();\n\n  @override\n  Widget build(BuildContext context) => const Scaffold(\n        body: Center(child: Text('NUS AI Center')),\n      );\n}\n"""
          if marker in text:
              text = text.replace(marker, "\n", 1)
          else:
              raise SystemExit('AI placeholder class block not found')
          path.write_text(text)
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q "features/ai/presentation/ai_hub_page.dart" lib/main.dart
          grep -q "builder: (_) => const AiHubPage()" lib/main.dart
          ! grep -q "class _AiLaunchPage" lib/main.dart

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "ci: wire real AI hub from home"
          git push
