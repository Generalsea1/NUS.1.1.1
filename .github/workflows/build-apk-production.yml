
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -print | sort -V | tail -n 1)"
          test -x "$AAPT2"
          BADGING="$($AAPT2 dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "application-label:'NUS'"
          printf '%s\n' "$BADGING" | grep -Eq "application-icon[^:]*:'[^']*ic_launcher(_round)?"
          unzip -Z1 "$APK" | grep -Eq '(^|/)ic_launcher(_round)?\.png$'
          XML="$($AAPT2 dump xmltree --file AndroidManifest.xml "$APK")"
          printf '%s\n' "$XML" | grep -F 'android.intent.action.VIEW'
          printf '%s\n' "$XML" | grep -F 'android.intent.category.BROWSABLE'
          printf '%s\n' "$XML" | grep -F 'nus'
          printf '%s\n' "$XML" | grep -F 'android.permission.RECORD_AUDIO'
          printf '%s\n' "$XML" | grep -F 'android.speech.RecognitionService'
          sha256sum "$APK"
          stat -c '%s bytes' "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nus-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk