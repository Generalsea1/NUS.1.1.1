name: Build NUS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: nus-android-production-build
  cancel-in-progress: true

env:
  SUPABASE_URL: https://girxiyfineqruhwbnfbe.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_X2_W_WOBGQYlu7LTy-W91g_KaZd6dCI

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_URL" == https://*.supabase.co ]]
          [[ "$SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]]

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=nus .

      - name: Configure NUS deep link and notifications
        shell: python
        run: |
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          activity = 'android:name=".MainActivity"'
          start = text.find(activity)
          end = text.find('</activity>', start)
          if start < 0 or end < 0:
              raise SystemExit('MainActivity not found')
          if 'android:scheme="nus"' not in text:
              block = '''\n        <intent-filter>\n            <action android:name="android.intent.action.VIEW" />\n            <category android:name="android.intent.category.DEFAULT" />\n            <category android:name="android.intent.category.BROWSABLE" />\n            <data android:scheme="nus" />\n        </intent-filter>\n'''
              text = text[:end] + block + text[end:]
          permissions = '''\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'''
          if 'android.permission.POST_NOTIFICATIONS' not in text:
              text = text.replace('</manifest>', permissions + '</manifest>', 1)
          if 'ScheduledNotificationReceiver' not in text:
              text = text.replace('</application>', '''\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n                <action android:name="android.intent.action.PACKAGE_REPLACED" />\n                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />\n            </intent-filter>\n        </receiver>\n''' + '</application>', 1)
          manifest.write_text(text)

      - name: Normalize launcher icon and label
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          source='Neural_network_brain_app_icon_202609031742.jpeg'
          test -s "$source"
          manifest='android/app/src/main/AndroidManifest.xml'
          python3 - "$manifest" <<'PY'
          from pathlib import Path
          import re
          import sys
          p=Path(sys.argv[1]); t=p.read_text(); t,n=re.subn(r'android:label="[^"]*"','android:label="NUS"',t,count=1)
          if n != 1: raise SystemExit('Android label update failed')
          p.write_text(t)
          PY
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"; size="${spec##*:}"
            target="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$target"
            convert "$source" -auto-orient -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" -strip -define png:color-type=6 "$target/ic_launcher.png"
            cp "$target/ic_launcher.png" "$target/ic_launcher_round.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-debug.apk'
          test -s "$APK"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -print | sort -V | tail -n 1)"
          test -x "$AAPT2"
          BADGING="$($AAPT2 dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "application-label:'NUS'"
          unzip -l "$APK" | grep -E 'res/mipmap-(mdpi|hdpi|xhdpi|xxhdpi|xxxhdpi)/ic_launcher\.png$'
          XML="$($AAPT2 dump xmltree "$APK" AndroidManifest.xml)"
          printf '%s\n' "$XML" | grep -F 'android.intent.action.VIEW'
          printf '%s\n' "$XML" | grep -F 'android.intent.category.BROWSABLE'
          printf '%s\n' "$XML" | grep -F 'nus'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nus-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
