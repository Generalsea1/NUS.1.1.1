name: Verify NUS PR

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - feature/user-ai-connections
  workflow_dispatch:

concurrency:
  group: nus-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-time AI hub wiring
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'ci: remove one-time AI hub wiring') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/main.dart')
          text = path.read_text()
          import_line = "import 'features/appointments/presentation/appointments_page.dart';\n"
          ai_import = "import 'features/ai/presentation/ai_hub_page.dart';\n"
          if ai_import not in text:
              text = text.replace(import_line, import_line + ai_import, 1)
          old_nav = "builder: (_) => const _AiLaunchPage(),"
          new_nav = "builder: (_) => const AiHubPage(),"
          if old_nav not in text:
              raise SystemExit('AI navigation placeholder not found')
          text = text.replace(old_nav, new_nav, 1)
          marker = """\n/// Lightweight navigation card used to keep the home shell independent from\n/// optional AI infrastructure. The real AI page is opened from feature pages\n/// where the AI connection provider is available.\nclass _AiLaunchPage extends StatelessWidget {\n  const _AiLaunchPage();\n\n  @override\n  Widget build(BuildContext context) => const Scaffold(\n        body: Center(child: Text('NUS AI Center')),\n      );\n}\n"""
          if marker not in text:
              raise SystemExit('AI placeholder class block not found')
          text = text.replace(marker, "\n", 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "ci: apply one-time AI hub wiring"
          git push

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
