name: nus
version: 1.0.0+1
description: NUS — a bilingual personal life organizer, designed to grow into a global platform.
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.4.1
  flutter_timezone: ^5.1.0
  timezone: ^0.10.1
  supabase_flutter: ^2.15.4
  url_launcher: 6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
